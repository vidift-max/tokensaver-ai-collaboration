name: P2.26 Isolated Phone-02 Bridge Tests

on:
  push:
    branches:
      - mission/ai-phone-02-p2-25-adapter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-26-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge-node-tests:
    name: Node.js bridge tests (local HTTP fixture only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed mission commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record toolchain and exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version | tee p2-26-node-evidence.txt
          npm --version | tee -a p2-26-node-evidence.txt
          printf 'TESTED_SHA=%s\n' "$GITHUB_SHA" | tee -a p2-26-node-evidence.txt
      - name: Run bridge test suite
        shell: bash
        run: |
          set -o pipefail
          node --test prototypes/team-room-private-bridge/bridge.test.mjs 2>&1 | tee -a p2-26-node-evidence.txt
      - name: Upload isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-26-bridge-${{ github.sha }}
          path: p2-26-node-evidence.txt
          if-no-files-found: warn
          retention-days: 14
